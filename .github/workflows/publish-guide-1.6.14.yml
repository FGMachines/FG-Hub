name: Publish FG Link Illustrated Guide

on:
  push:
    branches: [ main ]
    paths:
      - '.release-input/1.6.14/book/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify guide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .release-input/1.6.14/book/part-*.b64 | base64 --decode > docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          echo '721320230238ba700302a5d625e99444d87385a7d891b101c55be204313a41fe  docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf' | sha256sum -c -
          test "$(pdfinfo docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf | awk '/^Pages:/ {print $2}')" = "55"

      - name: Commit illustrated guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FG Machines Documentation Bot'
          git config user.email 'fgmachines@proton.me'
          git add docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          git rm -r .release-input/1.6.14/book
          git commit -m 'Publish FG Link 1.6.14 illustrated Arabic user guide'
          git push
