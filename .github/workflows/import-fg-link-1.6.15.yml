name: Import FG Link 1.6.15 release

on:
  push:
    branches: [ release/1.6.15-publication ]
    paths:
      - '.github/workflows/import-fg-link-1.6.15.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_ARCHIVE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3898-8210-adc5-f6d3885ba4c2/raw?se=2026-09-29T14%3A51%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=1b318dbb-3b34-5dde-9331-c3c7201fdeb9&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A18%3A55Z&ske=2026-09-30T07%3A18%3A55Z&sks=b&skv=2026-02-06&sig=EpE7cEdwT1Ob7icIU0zCsjb1m8wOpEc%2BilR5L1AHVPE%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.6.15-publication

      - name: Download verified private-build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$RELEASE_ARCHIVE_URL" -o /tmp/fg-link-release.zip
          test -s /tmp/fg-link-release.zip
          unzip -q /tmp/fg-link-release.zip -d /tmp/fg-link-release
          test -s /tmp/fg-link-release/FG-Link-1.6.15-Hardened-Signed.apk

      - name: Publish distribution files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/1.6.15
          cp /tmp/fg-link-release/FG-Link-1.6.15-Hardened-Signed.apk releases/1.6.15/
          cp /tmp/fg-link-release/CERTIFICATE.txt releases/1.6.15/
          cp /tmp/fg-link-release/RELEASE-INFO.txt releases/1.6.15/
          sed 's#publish/##' /tmp/fg-link-release/SHA256SUMS.txt > releases/1.6.15/SHA256SUMS.txt
          cat > releases/1.6.15/RELEASE-INFO.md <<'EOF'
          # FG Link 1.6.15 - Build 44

          Official signed Android release published by **FG Machines**.

          - Package: `com.fgmachines.rck`
          - Version: **1.6.15**
          - Version code: **44**
          - R8 optimized/minified: **yes**
          - Resource shrinking: **yes**
          - Official-signature self-check: **enabled**
          - Publisher signing certificate SHA-256: `b9ca4a23be53f161a47b5aaf97023d2bbbeebdaf671337d2466fb74cc1f29fdf`
          - APK SHA-256: `90ab5e8c85847f3b65444f2eeae349c78fcc182625e6be6cb14c0c3066568903`

          VPS Direct remains a controlled test feature; Router/LAN/ZeroTier and the existing VPS relay path are unaffected.
          EOF
          rm -f .github/workflows/import-fg-link-1.6.15.yml

      - name: Commit imported release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FG Machines Release Bot"
          git config user.email "fgmachines@proton.me"
          git add releases/1.6.15 .github/workflows/import-fg-link-1.6.15.yml
          git commit -m "Publish FG Link 1.6.15 signed Android release"
          git push origin HEAD:release/1.6.15-publication
