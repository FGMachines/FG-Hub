name: Sync user-supplied FG Link guide to release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-guide-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify user-supplied PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          PDF='docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf'
          test -s "$PDF"
          test "$(head -c 5 "$PDF")" = '%PDF-'
          SIZE="$(stat -c %s "$PDF")"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          test "$SIZE" -gt 1000000
          test "$PAGES" -gt 10
          echo "GUIDE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "GUIDE_PAGES=$PAGES" >> "$GITHUB_ENV"
          echo "GUIDE_HASH=$(sha256sum "$PDF" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Refresh hashes and page count
        shell: bash
        run: |
          set -euo pipefail
          APK='releases/1.6.14/FG-Link-1.6.14-Hardened-Signed.apk'
          APK_HASH="$(sha256sum "$APK" | awk '{print $1}')"
          export APK_HASH
          python - <<'PY'
          from pathlib import Path
          import os, re

          gh = os.environ["GUIDE_HASH"]
          pages = os.environ["GUIDE_PAGES"]

          readme = Path("README.md")
          s = readme.read_text(encoding="utf-8")
          s, n1 = re.subn(
              r'(- \*\*Illustrated guide SHA-256:\*\* `)[0-9a-f]{64}(`)',
              rf'\g<1>{gh}\g<2>', s, count=1
          )
          s, n2 = re.subn(
              r'(\| \*\*الدليل العربي المصوّر - )\d+( صفحة\*\* \|)',
              rf'\g<1>{pages}\g<2>', s, count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"README replacements failed: hash={n1}, pages={n2}")
          readme.write_text(s, encoding="utf-8")

          auth = Path("docs/AUTHENTICITY.md")
          s = auth.read_text(encoding="utf-8")
          marker = "## Illustrated Arabic guide"
          before, sep, after = s.partition(marker)
          if not sep:
              raise SystemExit("Illustrated guide section missing")
          after, n3 = re.subn(r'(- Pages: \*\*)\d+(\*\*)', rf'\g<1>{pages}\g<2>', after, count=1)
          after, n4 = re.subn(r'(- SHA-256: `)[0-9a-f]{64}(`)', rf'\g<1>{gh}\g<2>', after, count=1)
          if n3 != 1 or n4 != 1:
              raise SystemExit(f"AUTHENTICITY replacements failed: pages={n3}, hash={n4}")
          auth.write_text(before + sep + after, encoding="utf-8")
          PY

          printf '%s  %s\n%s  %s\n'             "$APK_HASH" 'FG-Link-1.6.14-Hardened-Signed.apk'             "$GUIDE_HASH" 'FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf'             > releases/1.6.14/SHA256SUMS.txt

      - name: Remove obsolete generated-guide machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/build_guide.py
          git rm -f .github/workflows/publish-guide-final.yml

      - name: Commit canonical guide metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FG Machines Documentation Bot'
          git config user.email 'fgmachines@proton.me'
          git add README.md docs/AUTHENTICITY.md releases/1.6.14/SHA256SUMS.txt
          git commit -m 'Publish user-supplied FG Link guide and lock canonical documentation'
          git push

      - name: Replace GitHub Release guide and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.6.14             docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf             releases/1.6.14/SHA256SUMS.txt             --clobber

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SIZE="$(gh release view v1.6.14 --json assets --jq '.assets[] | select(.name=="FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf") | .size')"
          test "$RELEASE_SIZE" = "$GUIDE_SIZE"
          echo "Published guide: $GUIDE_PAGES pages, $GUIDE_SIZE bytes, SHA-256 $GUIDE_HASH"
