name: Publish FG Link illustrated guide final

on:
  push:
    branches: [ main ]
    paths:
      - '.release-input/final-book/READY'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/final-book/part-*.b64 | base64 --decode > /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          echo '56c93e85aa5aee10716e385b4d8e514c6a2eea541031a9868d6fb2af0d73763a  /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf' | sha256sum -c -
          test "$(git hash-object /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" = "198d979368646b465f181be9b7d395e758877c6a"
          test "$(head -c 5 /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" = "%PDF-"
          test "$(stat -c %s /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" -gt 500000

      - name: Publish and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cp /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          git config user.name 'FG Machines Documentation Bot'
          git config user.email 'fgmachines@proton.me'
          git add docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          git rm -r .release-input/final-book
          git rm .github/workflows/publish-guide-final.yml
          git commit -m 'Publish final FG Link illustrated Arabic guide'
          git push
