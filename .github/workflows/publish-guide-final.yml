name: Publish FG Link illustrated guide final

on:
  push:
    branches: [ main ]
    paths:
      - '.release-input/final-book/READY'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/final-book/part-*.b64 | base64 --decode > /tmp/fg-link-guide.pdf.xz
          echo 'f66084232f4491760912f32fd8fe53d9614b682c03a20aea8714cb511b3fc1ad  /tmp/fg-link-guide.pdf.xz' | sha256sum -c -
          xz -dc /tmp/fg-link-guide.pdf.xz > /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          echo '1f28ece79202de2a3c2891566d4afb46ec1696c4f8fe83328eb7c152ab3f82b7  /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf' | sha256sum -c -
          test "$(git hash-object /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" = "1e086647d3664c73d6e9c096ce778b5a37a94b3b"
          test "$(head -c 5 /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" = "%PDF-"
          test "$(stat -c %s /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf)" -gt 500000

      - name: Publish and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cp /tmp/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          git config user.name 'FG Machines Documentation Bot'
          git config user.email 'fgmachines@proton.me'
          git add docs/FG-Link-User-Guide-AR-Illustrated-v1.6.14.pdf
          git rm -r .release-input/final-book
          git rm .github/workflows/publish-guide-final.yml
          git commit -m 'Publish final FG Link illustrated Arabic guide'
          git push
