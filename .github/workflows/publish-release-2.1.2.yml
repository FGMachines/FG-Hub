name: Publish FG Link 2.1.2
on:
  push:
    branches: [main]
    paths: ['.release-trigger/2.1.2']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cat .release-parts/2.1.2/part* > release-upload/FG-Link-2.1.2-v47.apk
          cd release-upload
          echo '07c9307f9657b02c6893174a37f2a60701b0afae4c30985877599cc5abfeff0f  FG-Link-2.1.2-v47.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs FG-Link-2.1.2-v47.apk > CERTIFICATE.txt
          grep -F 'b9ca4a23be53f161a47b5aaf97023d2bbbeebdaf671337d2466fb74cc1f29fdf' CERTIFICATE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FG-Link-2.1.2-v47.apk > package.txt
          grep -F "package: name='com.fgmachines.rck' versionCode='47' versionName='2.1.2'" package.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.1.2 release-upload/FG-Link-2.1.2-v47.apk release-upload/SHA256SUMS.txt release-upload/CERTIFICATE.txt --draft --title "FG Link 2.1.2" --notes-file releases/2.1.2/RELEASE_NOTES.md
          gh release edit v2.1.2 --draft=false --latest
