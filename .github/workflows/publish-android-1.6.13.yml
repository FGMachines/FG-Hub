name: Publish FG Link 1.6.13 Android

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified signed Android artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4494-8210-a334-133cce110bcf/raw?se=2026-09-29T09%3A52%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=9e08dc52-46c9-53cd-b915-358123e264ba&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A13%3A12Z&ske=2026-09-30T06%3A13%3A12Z&sks=b&skv=2026-02-06&sig=MifplZuATgXT4NA2mcuJosUgG2gVkuFJ2iulXGr9RDM%3D'
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o /tmp/fg-link-1.6.13.zip
          unzip -q /tmp/fg-link-1.6.13.zip -d /tmp/fg-link-1.6.13
          test -s /tmp/fg-link-1.6.13/FG-Link-1.6.13-Hardened-Signed.apk
          echo '327f639f73e192c642c2fdd75af842cfd4a5825d6c26d87d3ec64ebc6dbc3824  /tmp/fg-link-1.6.13/FG-Link-1.6.13-Hardened-Signed.apk' | sha256sum -c -
          mkdir -p releases/1.6.13
          cp /tmp/fg-link-1.6.13/FG-Link-1.6.13-Hardened-Signed.apk releases/1.6.13/
          cp /tmp/fg-link-1.6.13/SHA256SUMS.txt releases/1.6.13/
          cp /tmp/fg-link-1.6.13/CERTIFICATE.txt releases/1.6.13/
          cp /tmp/fg-link-1.6.13/RELEASE-INFO.txt releases/1.6.13/

      - name: Commit public Android package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FG Machines Release Bot'
          git config user.email 'fgmachines@proton.me'
          git add releases/1.6.13
          git commit -m 'Publish FG Link Android 1.6.13 build 42'
          git push
