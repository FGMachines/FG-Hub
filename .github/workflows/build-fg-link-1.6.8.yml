name: Build FG Link 1.6.8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fg-link-1.6.8.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private build inputs
        env:
          SRC_TOKEN: ${{ secrets.FG_SOURCE_TOKEN }}
          KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SRC_TOKEN"
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"

      - name: Checkout isolated FG source
        uses: actions/checkout@v4
        with:
          repository: FGMachines/FG-Link-Source
          token: ${{ secrets.FG_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify hardened release policy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '1.6.8'" app/build.gradle
          grep -q "versionCode 36" app/build.gradle
          grep -q "minifyEnabled true" app/build.gradle
          grep -q "shrinkResources true" app/build.gradle
          grep -q -- "-repackageclasses f" app/proguard-rules.pro
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Prepare official signing
        env:
          KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/fg-link-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FG_RCK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FG_RCK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FG_RCK_KEY_ALIAS=fg-link-release" >> "$GITHUB_ENV"
          echo "FG_RCK_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint and build hardened release
        working-directory: source
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleRelease

      - name: Verify hardened APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.fgmachines.rck' versionCode='36' versionName='1.6.8'" /tmp/badging.txt
          grep -q "application-label:'FG Link'" /tmp/badging.txt
          "$APKSIGNER" verify --print-certs "$APK"

          unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings > /tmp/dex-strings.txt || true
          if grep -qE 'MttlProtocol|MttlProvisioner|MttlControllerServer|LocalApiServer|DeviceBoundSigner' /tmp/dex-strings.txt; then
            echo "Sensitive implementation class names remain visible after R8."
            exit 1
          fi

          mkdir -p ../publish
          cp "$APK" ../publish/FG-Link-1.6.8-Hardened.apk
          sha256sum ../publish/FG-Link-1.6.8-Hardened.apk | tee ../publish/SHA256SUMS.txt
          "$APKSIGNER" verify --print-certs "$APK" > ../publish/CERTIFICATE.txt
          printf 'FG Link 1.6.8 Hardened\nPackage: com.fgmachines.rck\nVersion code: 36\nPublisher: FG Machines\nR8 optimized: yes\n' > ../publish/RELEASE-INFO.txt

      - name: Upload official publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.8-Hardened-Official
          path: publish/
          if-no-files-found: error
