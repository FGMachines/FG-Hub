name: Build FG Link 1.6.8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private source configuration
        env:
          SRC_REPO: ${{ secrets.FG_SOURCE_REPO }}
          SRC_TOKEN: ${{ secrets.FG_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SRC_REPO"
          test -n "$SRC_TOKEN"

      - name: Checkout private engineering source
        env:
          SRC_REPO: ${{ secrets.FG_SOURCE_REPO }}
          SRC_TOKEN: ${{ secrets.FG_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --quiet             "https://x-access-token:${SRC_TOKEN}@github.com/${SRC_REPO}.git" source
          cd source
          git checkout --quiet release/1.6.8-hardened-fg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare official signing
        env:
          KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FG_RCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FG_RCK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/fg-link-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FG_RCK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FG_RCK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FG_RCK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FG_RCK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build hardened release
        working-directory: source
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleRelease

      - name: Verify APK
        working-directory: source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p ../publish
          cp "$APK" ../publish/FG-Link-1.6.8.apk
          sha256sum ../publish/FG-Link-1.6.8.apk > ../publish/SHA256SUMS.txt

      - name: Upload official publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.8-Official
          path: publish/
          if-no-files-found: error
